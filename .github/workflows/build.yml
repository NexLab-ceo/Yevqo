name: Build Yevqo

run-name: Yevqo build #${{ github.run_number }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Build Go binaries (android/arm64)
        run: |
          mkdir -p bin
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/yevqo-control ./cmd/control
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/yevqo-agent ./cmd/agent
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/yevqo-cli ./cmd/yevqo
          cp bin/yevqo-agent bin/yevqo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify frontend output
        run: |
          test -s public/index.html
          test -d public/_app
          find public -type f | sort

      - name: Determine shared package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Both packages will use version $VERSION"

      - name: Validate setup and updater scripts
        run: |
          bash -n packaging/setup-agent.sh
          bash -n packaging/setup-control.sh
          bash -n packaging/setup-all.sh
          bash -n scripts/install-agent.sh
          bash -n scripts/update-agent.sh
          bash -n scripts/update-all.sh
          bash -n scripts/auto-update-service.sh
          bash -n scripts/termux-boot.sh
          sh -n packaging/postinst-all
          sh -n packaging/postinst-agent

      - name: Package Yevqo all-in-one and standalone Agent
        shell: bash
        run: |
          set -euo pipefail
          PREFIX_ROOT="data/data/com.termux/files/usr"
          rm -rf build-deb-all build-deb-agent
          mkdir -p \
            "build-deb-all/DEBIAN" \
            "build-deb-all/$PREFIX_ROOT/bin" \
            "build-deb-all/$PREFIX_ROOT/share/yevqo/public" \
            "build-deb-all/$PREFIX_ROOT/share/yevqo/migrations" \
            "build-deb-all/$PREFIX_ROOT/share/yevqo/scripts" \
            "build-deb-all/$PREFIX_ROOT/share/yevqo/systemd" \
            "build-deb-agent/DEBIAN" \
            "build-deb-agent/$PREFIX_ROOT/bin"

          install -m 0755 bin/yevqo-control "build-deb-all/$PREFIX_ROOT/bin/yevqo-control"
          install -m 0755 bin/yevqo-agent "build-deb-all/$PREFIX_ROOT/bin/yevqo-agent"
          install -m 0755 bin/yevqo-cli "build-deb-all/$PREFIX_ROOT/bin/yevqo-cli"
          install -m 0755 bin/yevqo "build-deb-agent/$PREFIX_ROOT/bin/yevqo"

          cp -a public/. "build-deb-all/$PREFIX_ROOT/share/yevqo/public/"
          cp -a migrations/. "build-deb-all/$PREFIX_ROOT/share/yevqo/migrations/"
          install -m 0755 scripts/install-control.sh "build-deb-all/$PREFIX_ROOT/share/yevqo/scripts/install-control.sh"
          install -m 0755 scripts/install-agent.sh "build-deb-all/$PREFIX_ROOT/share/yevqo/scripts/install-agent.sh"
          install -m 0755 scripts/termux-boot.sh "build-deb-all/$PREFIX_ROOT/share/yevqo/termux-boot.sh"
          install -m 0755 systemd/yevqo-control.sh "build-deb-all/$PREFIX_ROOT/share/yevqo/systemd/yevqo-control.sh"
          install -m 0755 systemd/yevqo-agent.sh "build-deb-all/$PREFIX_ROOT/share/yevqo/systemd/yevqo-agent.sh"
          install -m 0755 packaging/setup-all.sh "build-deb-all/$PREFIX_ROOT/bin/yevqo-setup"
          install -m 0755 packaging/setup-control.sh "build-deb-all/$PREFIX_ROOT/bin/yevqo-setup-control"
          install -m 0755 packaging/setup-agent.sh "build-deb-all/$PREFIX_ROOT/bin/yevqo-setup-agent"
          install -m 0755 scripts/update-all.sh "build-deb-all/$PREFIX_ROOT/bin/yevqo-update-all"
          install -m 0755 scripts/auto-update-service.sh "build-deb-all/$PREFIX_ROOT/bin/yevqo-auto-update-service"
          install -m 0755 packaging/postinst-all "build-deb-all/DEBIAN/postinst"

          install -m 0755 packaging/setup-agent.sh "build-deb-agent/$PREFIX_ROOT/bin/yevqo-setup"
          install -m 0755 scripts/update-agent.sh "build-deb-agent/$PREFIX_ROOT/bin/yevqo-update"
          install -m 0755 scripts/auto-update-service.sh "build-deb-agent/$PREFIX_ROOT/bin/yevqo-auto-update-service"
          install -m 0755 packaging/postinst-agent "build-deb-agent/DEBIAN/postinst"

          cat > build-deb-all/DEBIAN/control <<EOF
          Package: yevqo-all
          Version: $VERSION
          Architecture: aarch64
          Maintainer: NexLab
          Depends: mariadb, php, git, curl, jq, coreutils, termux-services
          Provides: veltrix-all
          Conflicts: veltrix-all, yevqo
          Replaces: veltrix-all
          Section: utils
          Priority: optional
          Homepage: https://github.com/NexLab-ceo/Yevqo
          Description: Yevqo Control Plane and Agent for Termux
           Includes server, Agent, web UI, migrations and setup scripts.
           cloudflared can be installed separately when Cloudflare Tunnel is needed.
          EOF

          cat > build-deb-agent/DEBIAN/control <<EOF
          Package: yevqo
          Version: $VERSION
          Architecture: aarch64
          Maintainer: NexLab
          Depends: php, git, curl, jq, termux-services
          Conflicts: yevqo-agent, veltrix-agent, yevqo-all
          Replaces: yevqo-agent, veltrix-agent
          Section: utils
          Priority: optional
          Homepage: https://github.com/NexLab-ceo/Yevqo
          Description: Yevqo standalone Android Agent for Termux
           Installs the Agent as the simple yevqo command with setup and update commands.
           cloudflared is optional and can be installed separately.
          EOF

          chmod 0755 build-deb-all/DEBIAN/postinst build-deb-agent/DEBIAN/postinst
          dpkg-deb --build --root-owner-group build-deb-all "yevqo-all_${VERSION}_aarch64.deb"
          dpkg-deb --build --root-owner-group build-deb-agent "yevqo_${VERSION}_aarch64.deb"

      - name: Verify all-in-one and standalone packages
        shell: bash
        run: |
          set -euo pipefail
          ALL="yevqo-all_${VERSION}_aarch64.deb"
          AGENT="yevqo_${VERSION}_aarch64.deb"
          test -s "$ALL"
          test -s "$AGENT"
          test "$(dpkg-deb --field "$ALL" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$AGENT" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$ALL" Package)" = "yevqo-all"
          test "$(dpkg-deb --field "$AGENT" Package)" = "yevqo"
          dpkg-deb --field "$ALL" Architecture | grep -x aarch64
          dpkg-deb --field "$AGENT" Architecture | grep -x aarch64
          dpkg-deb --contents "$ALL" > /tmp/yevqo-all.contents
          dpkg-deb --contents "$AGENT" > /tmp/yevqo.contents
          grep -q '/bin/yevqo-control$' /tmp/yevqo-all.contents
          grep -q '/bin/yevqo-agent$' /tmp/yevqo-all.contents
          grep -q '/bin/yevqo-cli$' /tmp/yevqo-all.contents
          grep -q '/bin/yevqo-update-all$' /tmp/yevqo-all.contents
          grep -q '/bin/yevqo-auto-update-service$' /tmp/yevqo-all.contents
          grep -q '/bin/yevqo$' /tmp/yevqo.contents
          grep -q '/bin/yevqo-setup$' /tmp/yevqo.contents
          grep -q '/bin/yevqo-update$' /tmp/yevqo.contents
          grep -q '/bin/yevqo-auto-update-service$' /tmp/yevqo.contents
          if grep -Eq 'yevqo-control|share/yevqo/public|migrations|yevqo-update-all|/bin/yevqo-agent$' /tmp/yevqo.contents; then
            echo "Standalone Yevqo package contains unexpected payload" >&2
            exit 1
          fi
          dpkg-deb --info "$ALL"
          dpkg-deb --info "$AGENT"

      - name: Generate package checksums
        run: sha256sum "yevqo-all_${VERSION}_aarch64.deb" "yevqo_${VERSION}_aarch64.deb" > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yevqo-android-aarch64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            yevqo-all_${{ env.VERSION }}_aarch64.deb
            yevqo_${{ env.VERSION }}_aarch64.deb
            SHA256SUMS

      - name: Publish Yevqo packages to VELTRIX Dock
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: NexLab-ceo/veltrix-dock
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: |
            yevqo-all_${{ env.VERSION }}_aarch64.deb
            yevqo_${{ env.VERSION }}_aarch64.deb
            SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
