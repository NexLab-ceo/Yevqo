name: Build VELTRIX Dock

on:
  push:
    branches:
      - feature/database-server-wizard
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build Go binaries (android/arm64)
        run: |
          mkdir -p bin
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bin/veltrix-control ./cmd/control
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bin/veltrix-agent ./cmd/agent

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Verify packaged frontend
        run: test -s public/index.html

      - name: Package .deb
        run: |
          VERSION="0.1.0-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "Building version: $VERSION"

          DEB_DIR="build-deb"
          rm -rf "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/data/data/com.termux/files/usr/bin"
          mkdir -p "$DEB_DIR/data/data/com.termux/files/usr/share/veltrix"

          cp bin/veltrix-control "$DEB_DIR/data/data/com.termux/files/usr/bin/"
          cp bin/veltrix-agent "$DEB_DIR/data/data/com.termux/files/usr/bin/"
          chmod +x "$DEB_DIR/data/data/com.termux/files/usr/bin/"*

          cp -r public/. "$DEB_DIR/data/data/com.termux/files/usr/share/veltrix/"

          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: veltrix
          Version: $VERSION
          Architecture: aarch64
          Maintainer: VELTRIX
          Depends: php, git
          Section: utils
          Priority: optional
          Homepage: https://github.com/NexLab-ceo/veltrix
          Description: VELTRIX Dock server manager for Termux
           Includes the Control Plane, Android Agent and static web interface.
          EOF

          dpkg-deb --build "$DEB_DIR" "veltrix_${VERSION}_aarch64.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-android-aarch64
          if-no-files-found: error
          path: |
            bin/veltrix-control
            bin/veltrix-agent
            veltrix_*_aarch64.deb

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/veltrix-control
            bin/veltrix-agent
            veltrix_*_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
