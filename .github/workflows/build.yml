name: Build VELTRIX Dock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build Go binaries (android/arm64)
        run: |
          mkdir -p bin
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bin/veltrix-control ./cmd/control
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bin/veltrix-agent ./cmd/agent

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

           - name: Package .deb
             run: |
                # Версия: из тега, иначе "0.1.0-dev"
                if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                  VERSION="${GITHUB_REF#refs/tags/v}"
                else
                  VERSION="0.1.0-dev"
                fi
      
                echo "Building version: $VERSION"
      
                DEB_DIR="build-deb"
                rm -rf "$DEB_DIR"
                mkdir -p "$DEB_DIR/DEBIAN"
                mkdir -p "$DEB_DIR/data/data/com.termux/files/usr/bin"
                mkdir -p "$DEB_DIR/data/data/com.termux/files/usr/share/veltrix"
      
                cp bin/veltrix-control "$DEB_DIR/data/data/com.termux/files/usr/bin/"
                cp bin/veltrix-agent   "$DEB_DIR/data/data/com.termux/files/usr/bin/"
                chmod +x "$DEB_DIR/data/data/com.termux/files/usr/bin/"*
      
                if [ -d "public" ]; then
                  cp -r public/* "$DEB_DIR/data/data/com.termux/files/usr/share/veltrix/"
                fi
      
                cat > "$DEB_DIR/DEBIAN/control" <<EOF
                Package: veltrix
                Version: $VERSION
                Architecture: aarch64
                Maintainer: Your Name <you@example.com>
                Depends: php, git
                Section: utils
                Priority: optional
                Homepage: https://github.com/your-username/veltrix-dock
                Description: Lightweight server manager for Termux
                 VELTRIX Dock manages PHP sites, monitors resources, and handles git deployments.
                EOF
      
                dpkg-deb --build "$DEB_DIR" "veltrix_${VERSION}_aarch64.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-binaries
          path: |
            bin/veltrix-control
            bin/veltrix-agent
            veltrix_*_aarch64.deb

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/veltrix-control
            bin/veltrix-agent
            veltrix_*_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
