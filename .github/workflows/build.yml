name: Build Yevqo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Build Go binaries (android/arm64)
        run: |
          mkdir -p bin
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/veltrix-control ./cmd/control
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/veltrix-agent ./cmd/agent
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/yevqo ./cmd/yevqo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Verify frontend output
        run: |
          test -s public/index.html
          test -d public/_app
          find public -type f | sort

      - name: Determine shared package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Both packages will use version $VERSION"

      - name: Validate setup and updater scripts
        run: |
          bash -n packaging/setup-agent.sh
          bash -n packaging/setup-control.sh
          bash -n packaging/setup-all.sh
          bash -n scripts/update-agent.sh
          bash -n scripts/update-all.sh
          sh -n packaging/postinst-all
          sh -n packaging/postinst-agent

      - name: Package veltrix-all and veltrix-agent
        shell: bash
        run: |
          set -euo pipefail
          PREFIX_ROOT="data/data/com.termux/files/usr"
          rm -rf build-deb-all build-deb-agent
          mkdir -p \
            "build-deb-all/DEBIAN" \
            "build-deb-all/$PREFIX_ROOT/bin" \
            "build-deb-all/$PREFIX_ROOT/share/veltrix/public" \
            "build-deb-all/$PREFIX_ROOT/share/veltrix/migrations" \
            "build-deb-all/$PREFIX_ROOT/share/veltrix/scripts" \
            "build-deb-all/$PREFIX_ROOT/share/veltrix/systemd" \
            "build-deb-agent/DEBIAN" \
            "build-deb-agent/$PREFIX_ROOT/bin"

          install -m 0755 bin/veltrix-control "build-deb-all/$PREFIX_ROOT/bin/veltrix-control"
          install -m 0755 bin/veltrix-agent "build-deb-all/$PREFIX_ROOT/bin/veltrix-agent"
          install -m 0755 bin/yevqo "build-deb-all/$PREFIX_ROOT/bin/yevqo"
          install -m 0755 bin/veltrix-agent "build-deb-agent/$PREFIX_ROOT/bin/veltrix-agent"

          cp -a public/. "build-deb-all/$PREFIX_ROOT/share/veltrix/public/"
          cp -a migrations/. "build-deb-all/$PREFIX_ROOT/share/veltrix/migrations/"
          install -m 0755 scripts/install-control.sh "build-deb-all/$PREFIX_ROOT/share/veltrix/scripts/install-control.sh"
          install -m 0755 scripts/install-agent.sh "build-deb-all/$PREFIX_ROOT/share/veltrix/scripts/install-agent.sh"
          install -m 0755 scripts/termux-boot.sh "build-deb-all/$PREFIX_ROOT/share/veltrix/termux-boot.sh"
          install -m 0755 systemd/veltrix-control.sh "build-deb-all/$PREFIX_ROOT/share/veltrix/systemd/veltrix-control.sh"
          install -m 0755 systemd/veltrix-agent.sh "build-deb-all/$PREFIX_ROOT/share/veltrix/systemd/veltrix-agent.sh"
          install -m 0755 packaging/setup-all.sh "build-deb-all/$PREFIX_ROOT/bin/veltrix-setup"
          install -m 0755 packaging/setup-control.sh "build-deb-all/$PREFIX_ROOT/bin/veltrix-setup-control"
          install -m 0755 packaging/setup-agent.sh "build-deb-all/$PREFIX_ROOT/bin/veltrix-setup-agent"
          install -m 0755 scripts/update-agent.sh "build-deb-all/$PREFIX_ROOT/bin/veltrix-update-agent"
          install -m 0755 scripts/update-all.sh "build-deb-all/$PREFIX_ROOT/bin/veltrix-update-all"
          install -m 0755 packaging/postinst-all "build-deb-all/DEBIAN/postinst"

          install -m 0755 packaging/setup-agent.sh "build-deb-agent/$PREFIX_ROOT/bin/veltrix-setup-agent"
          install -m 0755 scripts/update-agent.sh "build-deb-agent/$PREFIX_ROOT/bin/veltrix-update-agent"
          install -m 0755 packaging/postinst-agent "build-deb-agent/DEBIAN/postinst"

          cat > build-deb-all/DEBIAN/control <<EOF
          Package: veltrix-all
          Version: $VERSION
          Architecture: aarch64
          Maintainer: NexLab
          Depends: mariadb, php, git, curl, jq, termux-services
          Section: utils
          Priority: optional
          Homepage: https://github.com/NexLab-ceo/veltrix
          Description: Yevqo Control Plane and Agent for Termux
           Includes server, Agent, web UI, migrations and setup scripts.
           cloudflared can be installed separately when Cloudflare Tunnel is needed.
          EOF

          cat > build-deb-agent/DEBIAN/control <<EOF
          Package: veltrix-agent
          Version: $VERSION
          Architecture: aarch64
          Maintainer: VELTRIX
          Depends: php, git, curl, jq, termux-services
          Section: utils
          Priority: optional
          Homepage: https://github.com/NexLab-ceo/veltrix
          Description: Yevqo remote Android Agent for Termux
           Includes only the Agent executable and its interactive setup script.
           cloudflared is optional and can be installed separately.
          EOF

          chmod 0755 build-deb-all/DEBIAN/postinst build-deb-agent/DEBIAN/postinst
          dpkg-deb --build --root-owner-group build-deb-all "veltrix-all_${VERSION}_aarch64.deb"
          dpkg-deb --build --root-owner-group build-deb-agent "veltrix-agent_${VERSION}_aarch64.deb"

      - name: Verify both Debian packages
        shell: bash
        run: |
          set -euo pipefail
          ALL="veltrix-all_${VERSION}_aarch64.deb"
          AGENT="veltrix-agent_${VERSION}_aarch64.deb"
          test -s "$ALL"
          test -s "$AGENT"
          test "$(dpkg-deb --field "$ALL" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$AGENT" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$ALL" Package)" = "veltrix-all"
          test "$(dpkg-deb --field "$AGENT" Package)" = "veltrix-agent"
          dpkg-deb --field "$ALL" Architecture | grep -x aarch64
          dpkg-deb --field "$AGENT" Architecture | grep -x aarch64
          dpkg-deb --contents "$ALL" > /tmp/veltrix-all.contents
          dpkg-deb --contents "$AGENT" > /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-control$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-agent
          grep -q '/share/veltrix/public/index.html$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-update-all$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-agent$' /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-setup-agent$' /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-update-agent$' /tmp/veltrix-agent.contents
          if grep -Eq 'veltrix-control|share/veltrix/public|migrations|veltrix-update-all' /tmp/veltrix-agent.contents; then
            echo "Agent-only package contains server payload" >&2
            exit 1
          fi
          dpkg-deb --info "$ALL"
          dpkg-deb --info "$AGENT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-android-aarch64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            veltrix-all_${{ env.VERSION }}_aarch64.deb
            veltrix-agent_${{ env.VERSION }}_aarch64.deb

      - name: Publish full package to private repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            veltrix-all_${{ env.VERSION }}_aarch64.deb
            veltrix-agent_${{ env.VERSION }}_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Agent-only release to public repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: NexLab-ceo/veltrix-dock
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: |
            veltrix-agent_${{ env.VERSION }}_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
 /tmp/veltrix-all.contents
          grep -q '/bin/yevqo
          grep -q '/share/veltrix/public/index.html$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-update-all$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-agent$' /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-setup-agent$' /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-update-agent$' /tmp/veltrix-agent.contents
          if grep -Eq 'veltrix-control|share/veltrix/public|migrations|veltrix-update-all' /tmp/veltrix-agent.contents; then
            echo "Agent-only package contains server payload" >&2
            exit 1
          fi
          dpkg-deb --info "$ALL"
          dpkg-deb --info "$AGENT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-android-aarch64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            veltrix-all_${{ env.VERSION }}_aarch64.deb
            veltrix-agent_${{ env.VERSION }}_aarch64.deb

      - name: Publish full package to private repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            veltrix-all_${{ env.VERSION }}_aarch64.deb
            veltrix-agent_${{ env.VERSION }}_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Agent-only release to public repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: NexLab-ceo/veltrix-dock
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: |
            veltrix-agent_${{ env.VERSION }}_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
 /tmp/veltrix-all.contents
          grep -q '/share/veltrix/public/index.html$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-update-all$' /tmp/veltrix-all.contents
          grep -q '/bin/veltrix-agent$' /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-setup-agent$' /tmp/veltrix-agent.contents
          grep -q '/bin/veltrix-update-agent$' /tmp/veltrix-agent.contents
          if grep -Eq 'veltrix-control|share/veltrix/public|migrations|veltrix-update-all' /tmp/veltrix-agent.contents; then
            echo "Agent-only package contains server payload" >&2
            exit 1
          fi
          dpkg-deb --info "$ALL"
          dpkg-deb --info "$AGENT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-android-aarch64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            veltrix-all_${{ env.VERSION }}_aarch64.deb
            veltrix-agent_${{ env.VERSION }}_aarch64.deb

      - name: Publish full package to private repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            veltrix-all_${{ env.VERSION }}_aarch64.deb
            veltrix-agent_${{ env.VERSION }}_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Agent-only release to public repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: NexLab-ceo/veltrix-dock
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: |
            veltrix-agent_${{ env.VERSION }}_aarch64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
