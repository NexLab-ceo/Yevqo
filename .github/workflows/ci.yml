name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Cross-compile Android arm64 binaries
        run: |
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/agent
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/control
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/yevqo
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
