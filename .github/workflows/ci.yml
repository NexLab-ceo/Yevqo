name: Pull request checks

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Cross-compile Android arm64 binaries
        run: |
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/agent
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/control
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
